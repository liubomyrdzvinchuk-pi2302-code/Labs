<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛР №2</title>
<style>
body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; background: #fafafa; }
h1 { text-align: center; }
h2 { border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-top: 30px; }
button { padding: 6px 12px; border: 1px solid #888; background: #fff; cursor: pointer; }
button:hover { background: #dbe8ff; }
input { padding: 4px; }
table { border-collapse: collapse; }
th, td { border: 1px solid #999; padding: 4px 8px; }
</style>
</head>
<body>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-01.html'">Попередня</button> <button onclick="location.href='work-03.html'">Наступна</button> </p><h2 id="task-1">Завдання 1: Привітання з ім’ям</h2>
<div id="res1"></div>
<button id="run1">Ввести ім’я</button>
<script type="module">
{
const res = document.getElementById("res1");
document.getElementById("run1").onclick = () => {
  res.innerHTML = "";
  const userName = prompt('Введіть ваше ім’я:');
  alert(`Hello, ${userName}! Welcome to JavaScript`);
  res.textContent = `Hello, ${userName}! Welcome to JavaScript`;
};
}
</script>
<h2 id="task-2">Завдання 2: Рік народження</h2>
<div id="res2"></div>
<button id="run2">Ввести вік</button>
<script type="module">
{
const res = document.getElementById("res2");
document.getElementById("run2").onclick = () => {
  res.innerHTML = "";
  const age = Number(prompt('Скільки вам років?'));
  const currentYear = new Date().getFullYear();
  res.textContent = `You were born in ${currentYear - age}`;
};
}
</script>
<h2 id="task-3">Завдання 3: Повне ім’я (+ та шаблонний рядок)</h2>
<div id="res3"></div>
<button id="run3">Ввести ім’я та прізвище</button>
<script type="module">
{
const res = document.getElementById("res3");
document.getElementById("run3").onclick = () => {
  res.innerHTML = "";
  const firstName = prompt('Ім’я:');
  const lastName = prompt('Прізвище:');
  const a = 'Your full name is ' + firstName + ' ' + lastName;
  const b = `Your full name is ${firstName} ${lastName}`;
  console.log(a);
  console.log(b);
  res.innerHTML = a + '<br>' + b;
};
}
</script>
<h2 id="task-4">Завдання 4: Область видимості змінної</h2>
<div id="res4"></div>
<button id="run4">Ввести ім’я</button>
<script type="module">
{
const res = document.getElementById("res4");
document.getElementById("run4").onclick = () => {
  res.innerHTML = "";
  let userName = 'Любомир';
  if (true) {
    let userName = prompt('Введіть інше ім’я:');
    console.log('Всередині if: ' + userName);
    res.innerHTML = 'Всередині if: ' + userName + '<br>';
  }
  console.log('Зовні: ' + userName);
  res.innerHTML += 'Зовні: ' + userName + '<br>';
  res.innerHTML += 'Пояснення: let має блочну область видимості, тому змінна в if — це інша змінна, і зовнішня не змінюється.';
};
}
</script>
<h2 id="task-5">Завдання 5: Підтвердження за віком</h2>
<div id="res5"></div>
<button id="run5">Ввести ім’я та вік</button>
<script type="module">
{
const res = document.getElementById("res5");
document.getElementById("run5").onclick = () => {
  res.innerHTML = "";
  const name = prompt('Ім’я:');
  const age = prompt('Вік:');
  const ok = confirm(`Hello, ${name}! Your age is ${age}. Continue?`);
  alert(ok ? 'Welcome!' : 'Goodbye!');
};
}
</script>
<h2 id="task-6">Завдання 6: Парне чи непарне число</h2>
<div id="res6"></div>
<button id="run6">Ввести число</button>
<script type="module">
{
const res = document.getElementById("res6");
document.getElementById("run6").onclick = () => {
  res.innerHTML = "";
  const num = Number(prompt('Введіть число:'));
  alert(num % 2 === 0 ? 'Number is even' : 'Number is odd');
};
}
</script>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-01.html'">Попередня</button> <button onclick="location.href='work-03.html'">Наступна</button> </p>
</body>
</html>

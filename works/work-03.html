<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛР №3</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; color: #222; line-height: 1.5; }
h2 { font-size: 20px; margin: 32px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #d5d5d5; }
button { padding: 6px 14px; border: 1px solid #b5b5b5; border-radius: 3px; background: #f1f1f1; font-size: 15px; cursor: pointer; }
button:hover { background: #e3e3e3; }
input, select { padding: 5px 7px; border: 1px solid #b5b5b5; border-radius: 3px; font-size: 15px; }
table { border-collapse: collapse; margin: 6px 0; }
th, td { border: 1px solid #ccc; padding: 4px 10px; }
th { background: #f1f1f1; }
a { color: #1f5fa8; }
img { max-width: 100%; border: 1px solid #ddd; }
</style>
</head>
<body>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-02.html'">Попередня</button> <button onclick="location.href='work-04.html'">Наступна</button> </p><h2 id="task-1">Завдання 1: Повне ім’я та привітання</h2>
<div id="res1"></div>
<button id="run1">Ввести дані</button>
<script type="module">
{
const res = document.getElementById("res1");
document.getElementById("run1").onclick = () => {
  res.innerHTML = "";
  const out = t => { const p = document.createElement('p'); p.textContent = t; res.appendChild(p); };
  function getFullName(firstName, lastName) {
    return `${firstName} ${lastName}`;
  }
  function showGreeting(fullName, age) {
    out(`Hello, ${fullName}! You are ${age} years old.`);
  }
  const firstName = prompt('Ім’я:');
  const lastName = prompt('Прізвище:');
  const age = prompt('Вік:');
  const fullName = getFullName(firstName, lastName);
  showGreeting(fullName, age);
};
}
</script>
<h2 id="task-2">Завдання 2: Оцінка студента</h2>
<div id="res2"></div>
<button id="run2">Ввести студента</button>
<script type="module">
{
const res = document.getElementById("res2");
document.getElementById("run2").onclick = () => {
  res.innerHTML = "";
  const out = t => { const p = document.createElement('p'); p.textContent = t; res.appendChild(p); };
  function getStudentInfo() {
    const name = prompt('Ім’я студента:');
    const score = Number(prompt('Бал (0–12):'));
    return { name, score };
  }
  function checkGrade(score) {
    if (score >= 10) return 'Excellent';
    if (score >= 7) return 'Good';
    if (score >= 4) return 'Satisfactory';
    return 'Fail';
  }
  function showResult(name, grade) {
    out(`Student: ${name}`);
    out(`Grade: ${grade}`);
  }
  const info = getStudentInfo();
  const grade = checkGrade(info.score);
  showResult(info.name, grade);
};
}
</script>
<h2 id="task-3">Завдання 3: Чайові</h2>
<div id="res3"></div>
<button id="run3">Ввести суму рахунку</button>
<script type="module">
{
const res = document.getElementById("res3");
document.getElementById("run3").onclick = () => {
  res.innerHTML = "";
  const out = t => { const p = document.createElement('p'); p.textContent = t; res.appendChild(p); };
  function calculateTip(amount, percent = 10) {
    return amount * percent / 100;
  }
  function showResult(amount, tip) {
    out(`Bill: ${amount} грн`);
    out(`Tip (10%): ${tip} грн`);
    out(`Total: ${amount + tip} грн`);
  }
  const amount = Number(prompt('Сума рахунку, грн:', '450'));
  const tip = calculateTip(amount);
  showResult(amount, tip);
};
}
</script>
<h2 id="task-4">Завдання 4: Таймер з колбеком</h2>
<div id="res4"></div>
<button id="run4">Запустити таймер</button>
<script type="module">
{
const res = document.getElementById("res4");
document.getElementById("run4").onclick = () => {
  res.innerHTML = "";
  function startGreetingTimer(message, seconds, callback) {
    setTimeout(() => {
      res.textContent = message;
      callback();
    }, seconds * 1000);
  }
  res.textContent = 'Зачекайте 3 секунди...';
  startGreetingTimer('Hello!', 3, () => alert('Time is up!'));
};
}
</script>
<h2 id="task-5">Завдання 5: Калькулятор</h2>
<div id="res5"></div>
<button id="run5">Ввести числа</button>
<script type="module">
{
const res = document.getElementById("res5");
document.getElementById("run5").onclick = () => {
  res.innerHTML = "";
  function calculate(a, b, operation) {
    switch (operation) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return a / b;
      default: return 'Invalid operation';
    }
  }
  function showResult() {
    const a = Number(prompt('Перше число:'));
    const b = Number(prompt('Друге число:'));
    const op = prompt('Операція (+, -, *, /):');
    alert(calculate(a, b, op));
  }
  showResult();
};
}
</script>
<h2 id="task-6">Завдання 6: Лічильник (замикання)</h2>
<div id="res6"></div>
<button id="run6">Запустити лічильник</button>
<script type="module">
{
const res = document.getElementById("res6");
document.getElementById("run6").onclick = () => {
  res.innerHTML = "";
  function createClickCounter() {
    let count = 0;
    return function () {
      count++;
      console.log(count);
      const p = document.createElement('p');
      p.textContent = count;
      res.appendChild(p);
    };
  }
  const counter = createClickCounter();
  counter();
  counter();
  counter();
};
}
</script>

</body>
</html>

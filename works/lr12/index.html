<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог настільних ігор - Supabase</title>
  <link rel="stylesheet" href="styles/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="container">
    <p><a href="../../index.html">Головна</a></p>
    <h1>Каталог настільних ігор</h1>
    <p id="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Список ігор</h2>
      <ul id="games-list"></ul>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Додати гру</h2>
      <form id="game-form">
        <label for="title">Назва гри</label>
        <input id="title" name="title" required maxlength="150">
        <label for="genre">Жанр</label>
        <input id="genre" name="genre" required maxlength="150">
        <label for="players">Кількість гравців</label>
        <input id="players" name="players" type="number" min="1" max="99" value="2" required>
        <button type="submit">Додати</button>
      </form>
    </section>
  </main>
</body>
</html>

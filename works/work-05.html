<h1>Робота 5. CSS: блокова модель та позиціонування</h1>
<h2 id="task-1">Завдання 1. Блокова модель</h2>
<iframe width="100%" height="200" frameborder="0" style="border:0" sandbox="allow-scripts allow-modals" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;uk&quot;&gt;
&lt;head&gt;

<h2 id="task-2">Завдання 2. Display</h2>
<iframe width="100%" height="200" frameborder="0" style="border:0" sandbox="allow-scripts allow-modals" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;uk&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;title&gt;Завдання&lt;/title&gt;
&lt;style&gt;
.i{background:#fdd}
.ib{display:inline-block;width:120px;background:#dfd;padding:6px}
.b{background:#ddf;margin-top:6px}
body{font-family:Arial,sans-serif;padding:12px}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;span class=&quot;i&quot;&gt;inline&lt;/span&gt;&lt;span class=&quot;i&quot;&gt;inline&lt;/span&gt;
&lt;div class=&quot;ib&quot;&gt;inline-block&lt;/div&gt;&lt;div class=&quot;ib&quot;&gt;inline-block&lt;/div&gt;
&lt;div class=&quot;b&quot;&gt;block&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
" title="Завдання 2"></iframe>
<h2 id="task-3">Завдання 3. Позиціонування</h2>
<iframe width="100%" height="200" frameborder="0" style="border:0" sandbox="allow-scripts allow-modals" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;uk&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;title&gt;Завдання&lt;/title&gt;
&lt;style&gt;
.card{position:relative;width:200px;height:100px;border:1px solid #999;padding:12px}
.badge{position:absolute;top:-10px;right:-10px;background:red;color:#fff;padding:3px 8px;border-radius:12px;font-size:12px}
body{font-family:Arial,sans-serif;padding:12px};body{padding:30px}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;card&quot;&gt;Картка&lt;span class=&quot;badge&quot;&gt;NEW&lt;/span&gt;&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
" title="Завдання 3"></iframe>

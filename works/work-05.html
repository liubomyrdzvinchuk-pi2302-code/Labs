<div id="res1"></div>
<script type="module">
{

<h2 id="task-2">Завдання 2: Масив library</h2>
<div id="res2"></div>
<script type="module">
{
const res = document.getElementById("res2");
  const out = t => { const p = document.createElement('p'); p.textContent = t; res.appendChild(p); };
  const makeBook = (title, author, year, isRead) => ({
    title, author, year, isRead,
    bookInfo() {
      out(`Назва: ${this.title}, Автор: ${this.author}, Рік видання: ${this.year}, Прочитана: ${this.isRead ? 'Так' : 'Ні'}`);
    },
    markAsRead() {
      this.isRead = true;
    }
  });
  const makeLibrary = () => [
    makeBook('Harry Potter and the Sorcerer\'s Stone', 'J.K. Rowling', 1997, true),
    makeBook('The Hobbit', 'J.R.R. Tolkien', 1937, false),
    makeBook('1984', 'George Orwell', 1949, false)
  ];
  const displayLibrary = lib => lib.forEach(b => b.bookInfo());
  const library = makeLibrary();
  displayLibrary(library);
  out('— додаємо книгу —');
  library.push(makeBook('Dune', 'Frank Herbert', 1965, false));
  displayLibrary(library);
}
</script>
<h2 id="task-3">Завдання 3: Методи масивів</h2>

<script type="module">
{

  const makeBook = (title, author, year, isRead) => ({

  });

    makeBook('1984', 'George Orwell', 1949, false)
  ];
  const displayLibrary = lib => lib.forEach(b => b.bookInfo());
  const library = makeLibrary();
  library.sort((a, b) => a.year - b.year);
  console.log(library);
  out('За роком видання: ' + library.map(b => `${b.title} (${b.year})`).join(', '));

  console.log(unreadBooks);
  out('Непрочитані: ' + unreadBooks.map(b => b.title).join(', '));
  const tolkien = library.find(b => b.author === 'J.R.R. Tolkien');

  out('Tolkien: ' + (tolkien ? tolkien.title : 'не знайдено'));
}

<h2 id="task-6">Завдання 6: Середній рік видання</h2>

<script type="module">
{
const res = document.getElementById("res6");
  const out = t => { const p = document.createElement('p'); p.textContent = t; res.appendChild(p); };
  const makeBook = (title, author, year, isRead) => ({
    title, author, year, isRead,
    bookInfo() {
      out(`Назва: ${this.title}, Автор: ${this.author}, Рік видання: ${this.year}, Прочитана: ${this.isRead ? 'Так' : 'Ні'}`);
    },
    markAsRead() {
      this.isRead = true;
    }
  });
  const makeLibrary = () => [
    makeBook('Harry Potter and the Sorcerer\'s Stone', 'J.K. Rowling', 1997, true),

    makeBook('1984', 'George Orwell', 1949, false)
  ];

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛР №1</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; color: #222; line-height: 1.5; }
h2 { font-size: 20px; margin: 32px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #d5d5d5; }
button { padding: 6px 14px; border: 1px solid #b5b5b5; border-radius: 3px; background: #f1f1f1; font-size: 15px; cursor: pointer; }
button:hover { background: #e3e3e3; }
input, select { padding: 5px 7px; border: 1px solid #b5b5b5; border-radius: 3px; font-size: 15px; }
table { border-collapse: collapse; margin: 6px 0; }
th, td { border: 1px solid #ccc; padding: 4px 10px; }
th { background: #f1f1f1; }
a { color: #1f5fa8; }
img { max-width: 100%; border: 1px solid #ddd; }
</style>
</head>
<body>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-02.html'">Наступна</button> </p><h2 id="task-1">Завдання 1: Привітання</h2>
<div id="res1"></div>
<button id="run1">Показати привітання</button>
<script type="module">
{
const res = document.getElementById("res1");
document.getElementById("run1").onclick = () => {
  res.innerHTML = "";
  alert('Натисніть ОК');
  res.textContent = 'Hello, Дзвінчук Любомир!';
};
}
</script>
<h2 id="task-2">Завдання 2: Діалог Ок / Відміна</h2>
<div id="res2"></div>
<button id="run2">Показати діалог</button>
<script type="module">
{
const res = document.getElementById("res2");
document.getElementById("run2").onclick = () => {
  res.innerHTML = "";
  const ok = confirm('Натисніть Ок або Відміна');
  res.textContent = ok ? 'Натиснуто кнопку «Ок»' : 'Натиснуто кнопку «Відміна»';
};
}
</script>
<h2 id="task-3">Завдання 3: Таблиця множення для числа 4</h2>
<div id="res3"></div>
<script type="module">
{
const res = document.getElementById("res3");
  const n = 4;
  for (let i = 1; i <= 10; i++) {
    const p = document.createElement('p');
    p.textContent = `${n} × ${i} = ${n * i}`;
    res.appendChild(p);
  }
}
</script>
<h2 id="task-4">Завдання 4: Парне чи непарне</h2>
<div id="res4"></div>
<script type="module">
{
const res = document.getElementById("res4");
  function checkParity(num) {
    const p = document.createElement('p');
    const even = num % 2 === 0;
    p.textContent = `Число ${num} — ${even ? 'парне' : 'непарне'}`;
    p.style.color = even ? 'green' : 'red';
    res.appendChild(p);
  }
  checkParity(4);
}
</script>
<h2 id="task-5">Завдання 5: Пароль</h2>
<div id="res5"></div>
<script type="module">
{
const res = document.getElementById("res5");
  function createPassword(name, num) {
    return name.slice(0, 3) + num * 2;
  }
  const div = document.createElement('div');
  div.textContent = createPassword('Любомир', 4);
  res.appendChild(div);
}
</script>
<h2 id="task-6">Завдання 6: Середня оцінка</h2>
<div id="res6"></div>
<button id="run6">Ввести оцінки</button>
<script type="module">
{
const res = document.getElementById("res6");
document.getElementById("run6").onclick = () => {
  res.innerHTML = "";
  function average() {
    const a = Number(prompt('Оцінка 1:'));
    const b = Number(prompt('Оцінка 2:'));
    const c = Number(prompt('Оцінка 3:'));
    const div = document.createElement('div');
    div.id = '4';
    div.textContent = `Середнє: ${((a + b + c) / 3).toFixed(2)}`;
    res.appendChild(div);
  }
  average();
};
}
</script>
<h2 id="task-7">Завдання 7: Введення студентів</h2>
<div id="res7"></div>
<button id="run7">Почати введення</button>
<script type="module">
{
const res = document.getElementById("res7");
document.getElementById("run7").onclick = () => {
  res.innerHTML = "";
  const count = Number(prompt('Скільки студентів у групі?'));
  const list = document.createElement('ol');
  res.appendChild(list);
  for (let i = 1; i <= count; i++) {
    const name = prompt(`Прізвище та ім’я студента ${i}:`);
    const li = document.createElement('li');
    li.textContent = name;
    list.appendChild(li);
  }
};
}
</script>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-02.html'">Наступна</button> </p>
</body>
</html>

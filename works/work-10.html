<h2 id="task-2">Завдання 2. Парне чи непарне</h2>
<iframe width="100%" height="220" sandbox="allow-scripts allow-modals" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;uk&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;title&gt;Завдання&lt;/title&gt;
&lt;style&gt;
body{font-family:Arial,sans-serif;padding:12px}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;pre id=&quot;o&quot;&gt;&lt;/pre&gt;
&lt;script&gt;
function parity(n){ return n % 2 === 0 ? &#x27;парне&#x27; : &#x27;непарне&#x27;; }
let out=&#x27;&#x27;;
for(let i=1;i&lt;=6;i++) out+=i+&#x27; — &#x27;+parity(i)+&#x27;\n&#x27;;
document.getElementById(&#x27;o&#x27;).textContent=out;
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
" title="Завдання 2"></iframe>

&lt;pre id=&quot;o&quot;&gt;&lt;/pre&gt;
&lt;script&gt;
const fact=n=&gt;n&lt;=1?1:n*fact(n-1);
const fib=[0,1];

document.getElementById(&#x27;o&#x27;).textContent=&#x27;5! = &#x27;+fact(5)+&#x27;\nFib: &#x27;+fib.join(&#x27;, &#x27;);
&lt;/script&gt;

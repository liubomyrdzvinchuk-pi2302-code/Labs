<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛР №9</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; color: #222; line-height: 1.5; }
h2 { font-size: 20px; margin: 32px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #d5d5d5; }
button { padding: 6px 14px; border: 1px solid #b5b5b5; border-radius: 3px; background: #f1f1f1; font-size: 15px; cursor: pointer; }
button:hover { background: #e3e3e3; }
input, select { padding: 5px 7px; border: 1px solid #b5b5b5; border-radius: 3px; font-size: 15px; }
table { border-collapse: collapse; margin: 6px 0; }
th, td { border: 1px solid #ccc; padding: 4px 10px; }
th { background: #f1f1f1; }
a { color: #1f5fa8; }
img { max-width: 100%; border: 1px solid #ddd; }
</style>
</head>
<body>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-09.html'">Попередня</button> <button onclick="location.href='work-11.html'">Наступна</button> </p><h2 id="task-1">Завдання 2: checkNumber (then / catch)</h2>
<div id="res1"></div>
<button id="run1">Перевірити числа 5, 10, 15</button>
<script type="module">
{
const res = document.getElementById("res1");
document.getElementById("run1").onclick = () => {
  res.innerHTML = "";
  res.innerHTML = '<div id="loader2">Завантаження...</div><div id="result2"></div>';
  const loader = res.querySelector('#loader2');
  const result = res.querySelector('#result2');
  loader.style.display = 'block';
  
  function checkNumber(num) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (num > 10) resolve('Число більше 10');
        else reject('Число менше або дорівнює 10');
      }, 1000);
    });
  }
  
  const show = text => {
    const p = document.createElement('p');
    p.textContent = text;
    result.appendChild(p);
  };
  
  const checks = [5, 10, 15].map(function (n) {
    return checkNumber(n)
      .then(msg => show(`${n}: ${msg}`))
      .catch(err => show(`${n}: ${err}`));
  });
  
  Promise.all(checks).then(function () {
    loader.style.display = 'none';
  });
};
}
</script>
<h2 id="task-2">Завдання 3: randomNumber (випадковий час)</h2>
<div id="res2"></div>
<button id="run2">Запустити</button>
<script type="module">
{
const res = document.getElementById("res2");
document.getElementById("run2").onclick = () => {
  res.innerHTML = "";
  res.innerHTML = '<div id="loader3">Завантаження...</div><div id="result3"></div>';
  const loader = res.querySelector('#loader3');
  const result = res.querySelector('#result3');
  loader.style.display = 'block';
  
  function randomNumber() {
    const time = Math.floor(Math.random() * 2001) + 1000;
    const number = Math.floor(Math.random() * 100) + 1;
    return new Promise(function (resolve) {
      setTimeout(function () {
        resolve({ number: number, time: time });
      }, time);
    });
  }
  
  randomNumber()
    .then(function (data) {
      result.textContent = `Число: ${data.number}, час виконання: ${data.time} мс`;
    })
    .catch(function (err) {
      result.textContent = 'Помилка: ' + err;
    })
    .finally(function () {
      loader.style.display = 'none';
    });
};
}
</script>
<p><button onclick="location.href='../index.html'">Головна</button> <button onclick="location.href='work-09.html'">Попередня</button> <button onclick="location.href='work-11.html'">Наступна</button> </p>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <p><a href="../../index.html">Головна</a></p>
  <main class="todo">
    <h1>ToDo List</h1>

    <input id="new-task" type="text" placeholder="Додайте завдання" autocomplete="off">

    <p class="sort">
      <label for="sort">Сортування:</label>
      <select id="sort">
        <option value="new">Спочатку нові</option>
        <option value="undone">Невиконані спочатку</option>
        <option value="done">Виконані спочатку</option>
      </select>
    </p>

    <ul id="list"></ul>
  </main>
</body>
</html>
